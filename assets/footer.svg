<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="footer">
  <defs>
    <linearGradient id="footTag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7AB8"/>
      <stop offset="0.55" stop-color="#FF2E88"/>
      <stop offset="1" stop-color="#E0116B"/>
    </linearGradient>
    <pattern id="footDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="4" fill="#8B30FF" opacity="0.2"/>
    </pattern>
    <filter id="footSpray" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="150" rx="14" fill="#0B0B10"/>
  <rect x="0" y="0" width="300" height="150" fill="url(#footDots)"/>
  <rect x="900" y="0" width="300" height="150" fill="url(#footDots)"/>
  <rect x="6" y="6" width="1188" height="138" rx="10" fill="none" stroke="#8B30FF" stroke-width="2" opacity="0.6"/>

  <g filter="url(#footSpray)" fill="#00E676" opacity="0.8">
    <circle cx="150" cy="110" r="14"/>
    <circle cx="172" cy="95" r="6"/>
  </g>
  <g filter="url(#footSpray)" fill="#FFD400" opacity="0.85">
    <circle cx="1050" cy="45" r="12"/>
    <circle cx="1030" cy="60" r="5"/>
  </g>

  <g transform="translate(220,70) scale(0.6)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <path fill-rule="evenodd" fill="#00E676" stroke="#0B0B10" stroke-width="5"
            d="M0,-40 L9,-9 L40,0 L9,9 L0,40 L-9,9 L-40,0 L-9,-9 Z M0,-7 A7,7 0 1,0 0,7 A7,7 0 1,0 0,-7 Z"/>
    </g>
  </g>

  <g transform="translate(600,72) rotate(-1)" font-family="Impact,'Arial Black','Segoe UI',sans-serif" text-anchor="middle">
    <text x="5" y="5" font-size="52" letter-spacing="8" fill="#8B30FF" opacity="0.8">忍法 · 终</text>
    <text x="0" y="0" font-size="52" letter-spacing="8" fill="url(#footTag)" stroke="#0B0B10" stroke-width="9" stroke-linejoin="round" paint-order="stroke">忍法 · 终</text>
    <text x="0" y="42" font-size="22" letter-spacing="4" fill="#FFD400" stroke="#0B0B10" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SEE YOU, SPACE NINJA —— 后会有期</text>
  </g>

  <g fill="#FFFFFF">
    <path transform="translate(980,105) scale(0.7)" d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(300,40) scale(0.55)" d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
