<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="ZERAISSH - 嵌入式忍者">
  <defs>
    <linearGradient id="tagFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8AC2"/>
      <stop offset="0.45" stop-color="#FF2E88"/>
      <stop offset="1" stop-color="#D1005F"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M0,0 H46 M0,0 V46" stroke="#171726" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000000"/>
    </pattern>
    <pattern id="dotsPink" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.6" fill="#FF2E88" opacity="0.25"/>
    </pattern>
    <pattern id="dotsGreen" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="4.4" fill="#00E676" opacity="0.18"/>
    </pattern>
    <pattern id="caution" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#FFD400"/>
      <rect x="12" width="12" height="24" fill="#0B0B10"/>
    </pattern>
    <filter id="spray" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="gloss">
      <rect x="-420" y="-92" width="840" height="40"/>
    </clipPath>
  </defs>

  <!-- 底色 + 斜网格 + 网点 -->
  <rect width="1200" height="320" rx="18" fill="#0A0A0F"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="830" y="0" width="370" height="150" fill="url(#dotsPink)"/>
  <rect x="0" y="205" width="400" height="115" fill="url(#dotsGreen)"/>

  <!-- 霓虹辉光 -->
  <ellipse cx="600" cy="172" rx="390" ry="95" fill="#FF2E88" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="600" cy="235" rx="300" ry="38" fill="#00E676" opacity="0.08" filter="url(#soft)"/>

  <!-- 倾斜涂鸦底板 -->
  <polygon points="235,92 965,66 990,238 210,252" fill="#140A20" stroke="#FF2E88" stroke-width="3" opacity="0.92" filter="url(#spray)"/>

  <!-- 警示条纹 -->
  <rect x="24" y="288" width="150" height="16" fill="url(#caution)" stroke="#0B0B10" stroke-width="2"/>
  <rect x="1026" y="16" width="150" height="16" fill="url(#caution)" stroke="#0B0B10" stroke-width="2"/>

  <!-- 喷漆溅点 -->
  <g filter="url(#spray)" fill="#00E676" opacity="0.85">
    <circle cx="118" cy="86" r="24"/>
    <circle cx="150" cy="62" r="9"/>
    <circle cx="94" cy="116" r="6"/>
    <rect x="110" y="106" width="6" height="24" rx="3"/>
  </g>
  <g filter="url(#spray)" fill="#8B30FF" opacity="0.85">
    <circle cx="1100" cy="212" r="26"/>
    <circle cx="1068" cy="190" r="8"/>
    <circle cx="1128" cy="186" r="5"/>
    <rect x="1096" y="234" width="6" height="22" rx="3"/>
  </g>
  <g filter="url(#spray)" fill="#FFD400" opacity="0.9">
    <circle cx="930" cy="60" r="9"/>
    <circle cx="948" cy="46" r="4.5"/>
  </g>

  <!-- 旋转手里剑 -->
  <g transform="translate(95,232)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      <path fill-rule="evenodd" fill="#00E676" stroke="#0B0B10" stroke-width="5"
            d="M0,-40 L9,-9 L40,0 L9,9 L0,40 L-9,9 L-40,0 L-9,-9 Z M0,-7 A7,7 0 1,0 0,7 A7,7 0 1,0 0,-7 Z"/>
    </g>
  </g>
  <g transform="translate(1112,88) scale(0.8)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      <path fill-rule="evenodd" fill="#FF2E88" stroke="#0B0B10" stroke-width="5"
            d="M0,-40 L9,-9 L40,0 L9,9 L0,40 L-9,9 L-40,0 L-9,-9 Z M0,-7 A7,7 0 1,0 0,7 A7,7 0 1,0 0,-7 Z"/>
    </g>
  </g>

  <!-- 主标题：3D厚度 + 故障色散 + 白力场描边 + 渐变填充 + 高光 + 滴漆 -->
  <g transform="translate(600,172) rotate(-2)" font-family="Impact,'Arial Black','Segoe UI',sans-serif" text-anchor="middle">
    <text x="4" y="4" font-size="118" letter-spacing="6" fill="#8C1249">ZERAISSH</text>
    <text x="8" y="8" font-size="118" letter-spacing="6" fill="#6E0E3B">ZERAISSH</text>
    <text x="12" y="12" font-size="118" letter-spacing="6" fill="#500A2C">ZERAISSH</text>
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;-9 2;0 0;0 0;7 -2;0 0" keyTimes="0;0.82;0.85;0.88;0.93;0.96;1" dur="3.2s" repeatCount="indefinite"/>
      <text x="-7" y="3" font-size="118" letter-spacing="6" fill="#00E676">ZERAISSH</text>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;0 0;8 -3;0 0;-6 2;0 0" keyTimes="0;0.78;0.81;0.85;0.9;1" dur="2.7s" repeatCount="indefinite"/>
      <text x="7" y="-3" font-size="118" letter-spacing="6" fill="#8B30FF">ZERAISSH</text>
    </g>
    <text x="0" y="0" font-size="118" letter-spacing="6" fill="none" stroke="#F4F4F4" stroke-width="20" stroke-linejoin="round">ZERAISSH</text>
    <text x="0" y="0" font-size="118" letter-spacing="6" fill="url(#tagFill)" stroke="#0B0B10" stroke-width="14" stroke-linejoin="round" paint-order="stroke">ZERAISSH</text>
    <text x="0" y="0" font-size="118" letter-spacing="6" fill="#FFFFFF" opacity="0.25" clip-path="url(#gloss)">ZERAISSH</text>
    <g fill="url(#tagFill)" stroke="#0B0B10" stroke-width="2.5">
      <rect x="-189" y="2" width="7" height="16" rx="3.5"/>
      <rect x="-62" y="2" width="6" height="24" rx="3"/>
      <circle cx="-59" cy="30" r="3"/>
      <rect x="128" y="2" width="7" height="14" rx="3.5"/>
    </g>
  </g>

  <!-- 故障切条 -->
  <rect x="330" y="138" width="470" height="4" fill="#FF2E88" opacity="0.85">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 0;36 0;-24 0;0 0" keyTimes="0;0.9;0.93;0.97;1" dur="2.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="420" y="205" width="380" height="3" fill="#00E676" opacity="0.8">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 0;-30 0;18 0;0 0" keyTimes="0;0.88;0.92;0.96;1" dur="3.7s" repeatCount="indefinite"/>
  </rect>

  <!-- 轰！漫画爆闪 -->
  <g transform="translate(985,108) rotate(10)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.4s" repeatCount="indefinite"/>
      <polygon fill="#FFD400" stroke="#0B0B10" stroke-width="5" stroke-linejoin="round"
        points="0,-75 7.76,-28.98 37.5,-64.95 21.21,-21.21 64.95,-37.5 28.98,-7.76 75,0 28.98,7.76 64.95,37.5 21.21,21.21 37.5,64.95 7.76,28.98 0,75 -7.76,28.98 -37.5,64.95 -21.21,21.21 -64.95,37.5 -28.98,7.76 -75,0 -28.98,-7.76 -64.95,-37.5 -21.21,-21.21 -37.5,-64.95 -7.76,-28.98"/>
      <text x="0" y="22" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="60" text-anchor="middle"
            fill="#FF2E88" stroke="#0B0B10" stroke-width="8" stroke-linejoin="round" paint-order="stroke">轰!</text>
    </g>
  </g>

  <!-- 「忍」喷绘贴纸 -->
  <g transform="translate(150,120)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
      <g transform="rotate(-12)">
        <rect x="-52" y="-52" width="104" height="104" rx="8" fill="#8B30FF" stroke="#0B0B10" stroke-width="5" filter="url(#spray)"/>
        <text x="0" y="24" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="62" text-anchor="middle"
              fill="#00E676" stroke="#0B0B10" stroke-width="7" stroke-linejoin="round" paint-order="stroke">忍</text>
      </g>
    </g>
  </g>

  <!-- 涂鸦箭头 -->
  <g transform="translate(215,205) rotate(6)" stroke="#00E676" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#spray)">
    <path d="M0,0 C40,14 80,10 118,-6"/>
    <path d="M96,-20 L120,-7 L98,8"/>
  </g>

  <!-- 荧光标记带 + 副标题 -->
  <g transform="translate(600,238)">
    <rect x="-300" y="-24" width="600" height="42" fill="#00E676" transform="skewX(-8)"/>
    <text x="0" y="7" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="26" letter-spacing="4"
          text-anchor="middle" fill="#0B0B10">AKA · 嵌入式忍者 · EMBEDDED NINJA</text>
  </g>

  <!-- HUD 边角 -->
  <g stroke="#00E676" stroke-width="3" fill="none" opacity="0.9">
    <path d="M20,46 V20 H46"/>
    <path d="M1154,20 H1180 V46"/>
    <path d="M20,274 V300 H46"/>
    <path d="M1180,274 V300 H1154"/>
  </g>

  <!-- 赛博终端行 -->
  <g font-family="Consolas,'Courier New',monospace" font-size="15" fill="#00E676">
    <text x="40" y="40" opacity="0.85">> SYS://ZERAISSH.EXE --mode=ninja</text>
    <rect x="344" y="29" width="9" height="15">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 条码 -->
  <g transform="translate(1058,256)" fill="#E6E6E6" opacity="0.85">
    <rect x="0" y="0" width="3" height="26"/><rect x="5" y="0" width="2" height="26"/>
    <rect x="9" y="0" width="1" height="26"/><rect x="12" y="0" width="3" height="26"/>
    <rect x="17" y="0" width="1" height="26"/><rect x="20" y="0" width="2" height="26"/>
    <rect x="25" y="0" width="1" height="26"/><rect x="28" y="0" width="3" height="26"/>
    <rect x="34" y="0" width="2" height="26"/><rect x="38" y="0" width="1" height="26"/>
    <rect x="42" y="0" width="2" height="26"/><rect x="47" y="0" width="1" height="26"/>
    <rect x="51" y="0" width="3" height="26"/><rect x="57" y="0" width="1" height="26"/>
    <rect x="60" y="0" width="2" height="26"/><rect x="65" y="0" width="3" height="26"/>
    <rect x="70" y="0" width="1" height="26"/><rect x="74" y="0" width="2" height="26"/>
    <text x="0" y="40" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#8B949E">NO.0324-NINJA</text>
  </g>

  <!-- 闪烁星点 -->
  <g fill="#FFFFFF">
    <path transform="translate(350,78)" d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(880,196) scale(0.7)" d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(70,140) scale(0.6)" d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 扫描线 + 双重边框 -->
  <rect width="1200" height="320" rx="18" fill="url(#scan)" opacity="0.10"/>
  <rect x="7" y="7" width="1186" height="306" rx="14" fill="none" stroke="#8B30FF" stroke-width="2.5" opacity="0.8"/>
  <rect x="12" y="12" width="1176" height="296" rx="11" fill="none" stroke="#FF2E88" stroke-width="1" opacity="0.35"/>
</svg>
