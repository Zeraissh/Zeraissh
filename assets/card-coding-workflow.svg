<svg xmlns="http://www.w3.org/2000/svg" width="580" height="170" viewBox="0 0 580 170" role="img" aria-label="Coding_WorkFlow">
  <defs>
    <linearGradient id="c2Fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7AB8"/>
      <stop offset="0.55" stop-color="#FF2E88"/>
      <stop offset="1" stop-color="#E0116B"/>
    </linearGradient>
    <pattern id="c2Scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000000"/>
    </pattern>
    <filter id="c2Stamp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>

  <rect width="580" height="170" rx="12" fill="#0B0B10"/>
  <rect x="5" y="5" width="570" height="160" rx="9" fill="none" stroke="#8B30FF" stroke-width="2.5" opacity="0.85"/>
  <rect x="10" y="10" width="560" height="150" rx="7" fill="none" stroke="#FF2E88" stroke-width="1" opacity="0.3"/>

  <!-- 胶带角 -->
  <rect x="-14" y="14" width="70" height="18" fill="#FFFFFF" opacity="0.10" transform="rotate(-38 20 22)"/>
  <rect x="524" y="14" width="70" height="18" fill="#FFFFFF" opacity="0.10" transform="rotate(38 560 22)"/>

  <!-- 顶部栏 -->
  <text x="24" y="34" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#00E676">WANTED · 悬赏仓库</text>
  <text x="400" y="34" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#8B949E">CASE NO.002</text>
  <g transform="translate(500,52) rotate(-10)" filter="url(#c2Stamp)">
    <text x="0" y="0" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="24" text-anchor="middle"
          fill="#FFD400" stroke="#0B0B10" stroke-width="4" stroke-linejoin="round" paint-order="stroke">通缉令</text>
  </g>

  <!-- 仓库名 -->
  <text x="24" y="70" font-family="Impact,'Arial Black','Segoe UI',sans-serif" font-size="34" letter-spacing="1"
        fill="url(#c2Fill)" stroke="#0B0B10" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Coding_WorkFlow</text>

  <line x1="24" y1="86" x2="556" y2="86" stroke="#30363D" stroke-width="1.5"/>

  <!-- 描述 -->
  <text x="24" y="112" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="15" fill="#C9D1D9">代码工作流 · 引入即获得上位机 UI 工作流</text>

  <!-- 底部：语言 + 手里剑 -->
  <circle cx="31" cy="140" r="6" fill="#3178C6"/>
  <text x="44" y="145" font-family="'Segoe UI',sans-serif" font-size="14" fill="#8B949E">TypeScript</text>
  <g transform="translate(540,138) scale(0.32)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      <path fill-rule="evenodd" fill="#FF2E88" stroke="#0B0B10" stroke-width="5"
            d="M0,-40 L9,-9 L40,0 L9,9 L0,40 L-9,9 L-40,0 L-9,-9 Z M0,-7 A7,7 0 1,0 0,7 A7,7 0 1,0 0,-7 Z"/>
    </g>
  </g>

  <rect width="580" height="170" rx="12" fill="url(#c2Scan)" opacity="0.08"/>
</svg>
