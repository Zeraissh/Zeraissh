<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-label="divider">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset="0.5" stop-color="#8B30FF"/>
      <stop offset="1" stop-color="#00E676"/>
    </linearGradient>
    <filter id="divSpray" x="-10%" y="-60%" width="120%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
    </filter>
  </defs>
  <g filter="url(#divSpray)">
    <path d="M40,24 C300,10 500,38 760,22 S1100,30 1160,24" fill="none"
          stroke="url(#divGrad)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="300" cy="40" r="4" fill="#8B30FF"/>
    <circle cx="762" cy="42" r="5" fill="#8B30FF"/>
    <circle cx="1052" cy="38" r="3.5" fill="#00E676"/>
  </g>
</svg>
